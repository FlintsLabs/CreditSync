schema: 1
name: creditsync-mcp-conformance
status: verified-local-fixture
runner:
  package: "@modelcontextprotocol/conformance"
  version: "0.2.0-alpha.11"
  revision: "7169291ec0b68eb370fddcd9947313ab0d5e4156"
  checkout: external-and-explicit
  setup: "git clone https://github.com/modelcontextprotocol/conformance.git /absolute/path; git -C /absolute/path checkout 7169291ec0b68eb370fddcd9947313ab0d5e4156; cd /absolute/path && npm ci --ignore-scripts"
  install_note: "The pinned upstream checkout tracks package-lock.json, not bun.lock. Use npm ci only for that external runner; Bun --frozen-lockfile rejects first-time lockfile migration. CreditSync still uses Bun. The source runner does not require upstream prepare/build scripts."
  command: "cd backend && MCP_CONFORMANCE_ROOT=/absolute/path bun run mcp:conformance"
  validation: "The script requires an absolute MCP_CONFORMANCE_ROOT, verifies package name/version, and verifies git rev-parse HEAD before starting scenarios. It has no repository-specific default path."
fixture:
  adapter: "CreditSync Elysia MCP boundary plus executeMcpToolCall shared dispatcher"
  catalog: [test_simple_text, test_error_handling, json_schema_2020_12_tool, test_missing_capability, test_streaming_elicitation, test_logging_tool]
  database: none
  side_effects: none
  authentication: "The local wrapper adds only a synthetic bearer token; request bodies, MCP headers, tool names, errors, and responses are not rewritten."
scenarios:
  - name: tools-list
    status: required-and-passed
  - name: tools-call-simple-text
    status: required-and-passed
  - name: tools-call-error
    status: required-and-passed
  - name: json-schema-2020-12
    status: required-and-passed
  - name: http-header-validation
    status: required-and-passed
  - name: server-stateless
    status: required-and-passed
    checks: 28
unsupported_or_deferred:
  - capability: public OAuth/authorization-server deployment
    reason: "CreditSync is a private bearer-token deployment; no public authorization server is claimed."
    disposition: documented-limitation
  - capability: application list-change publication and cross-request subscription delivery
    reason: "The application advertises tools.listChanged=false and does not publish catalog-change events. The official server-stateless checks exercised the SDK's subscription acknowledgment, subscription-ID and filtering envelopes over POST/SSE; they were not skipped. This is not a claim of application event delivery or mobile subscription support."
    disposition: application-capability-not-advertised
  - capability: live tenant financial calls
    reason: "Conformance fixture must be side-effect free; DB-backed application paths are covered by separate disposable tests."
    disposition: excluded-from-fixture
baseline_policy: "No implementation failure is listed as an expected failure. A failed selected scenario blocks the gate and must be repaired at the adapter/fixture boundary."
