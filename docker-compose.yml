services:
  postgres:
    image: postgres:18
    container_name: creditsync-postgres
    restart: always
    environment:
      POSTGRES_DB: creditsync_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: creditsync-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: creditsync-dragonfly
    restart: always
    ulimits:
      memlock: -1
    ports:
      - "6381:6379"
    command: ["dragonfly", "--bind", "0.0.0.0", "--port", "6379", "--cache_mode=true"]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: creditsync-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - postgres
      - minio
      - dragonfly

volumes:
  postgres_data:
  minio_data:
